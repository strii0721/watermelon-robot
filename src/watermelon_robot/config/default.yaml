########################################### 以下是通用配置 ##########################################
# 目标检测模型相关
target_detection:
  model: 
    name: "yolov26-best-fp16.engine"
    task: "target-detection"
    use_engine: True
    device_no: "0"
    use_half: True
    image_size: [480, 640]
    confidence: 0.75
    iou: 0.7

# -------------------------------------------------------
# 导航线检测相关
lane_detection: 
  model:  
    name: "yolo26n-seg-b64-1780713028-fp16.engine"
    task: "lane-detection"
    use_engine: True
    device_no: "0"
    use_half: True
    confidence: 0.8
  roi:
    y_min_portion: 0.75                                     # 兴趣区域上界占图片高度比例
    y_max_portion: 0.99                                     # 兴趣区域下界占图片高度比例
  detect_step: 10
  lane_offset: 10
  
# -------------------------------------------------------
# 机械臂配置相关
robotic_arm: 
  activate: "fr5_0"
  profiles:
    fr3_0:
      ip: "192.168.58.2"
      speed_rate: 20                                  # 机械臂运动速率
      standby_status:
        use_cartesian: False                          # 选择是否使用笛卡尔六元组表述机械臂初始姿态，若为 False 则使用关节空间描述
        status: [90.0, -120.0, 120, -180, -90, -90]
      eye_in_hand: True
      calibration_marix: [[0, -1, 0, 25],             # 相机手眼校准矩阵。在“眼在手上”方案中应为相机参考系到末端执行器变换矩阵；在“眼在手外”方案中应为相机参考系到机械臂世界坐标系变换矩阵。
                          [1, 0, 0, 60],
                          [0, 0, 1, 10],
                          [0, 0, 0, 1]]
      tool_error: [-50, 170, -90]                     # 工具的位置偏差（相机参考系下）
      working_space: [[-200, 200], 
                      [-50, 160],
                      [150, 500]]
      

    fr5_0:
      ip: "192.168.58.2"
      speed_rate: 20                                  # 机械臂运动速率
      standby_status:
        use_cartesian: False                          # 选择是否使用笛卡尔六元组表述机械臂初始姿态，若为 False 则使用关节空间描述
        status: [89.0, -120.0, 120, -179, -89, -89]
      eye_in_hand: True
      calibration_marix: [[0, -1, 0, 60],            # 相机手眼校准矩阵。在“眼在手上”方案中应为相机参考系到末端执行器变换矩阵；在“眼在手外”方案中应为相机参考系到机械臂世界坐标系变换矩阵。
                          [1, 0, 0, -5],
                          [0, 0, 1, 10],
                          [0, 0, 0, 1]]
      tool_error: [0, 0, 0]                           # 工具的位置偏差（相机参考系下）
      working_space: [[-200, 200], 
                      [-50, 160],
                      [150, 500]]

# -------------------------------------------------------
# 底盘控制相关
chassis: 
  pid_controller: 
    pid_triple: [0.2, 0.02, 0.01]
    control_interval: 0.1
    integral_limit: 10
    output_limit: 10
  forward_speed: 0.65                                       # 底盘前进速度（m/s)。实验室环境设置0.4，田间设置0.6-0.7。
  stop_delay_sec: 3                                         # 当前版本底盘停止方案用来控制底盘停止的延迟。相关函数注释里有说明。

# -------------------------------------------------------
# 剪刀控制相关
scissors:
  tool_id: 8                # 剪刀在机械臂中的工具编号
  close_flag: 1             # 0/1 哪一个控制剪刀闭合
  open_delay_sec: 2         # 剪刀张开、闭合结束等待时间

# -------------------------------------------------------


######################################## 以下是节点初始化器配置 ########################################
_node_initializer:

  ################
  # 逻辑控制器节点 #
  ################
  ZOOT:
    executable: "logic_controller"
    node_type: "scheduler"
    heartbeat_period_sec: 0.1
    channels:
      DWDB_221E: "ns/sensor/DWDB_221E"
      AMA_10: "ns/sensor/AMA_10"
      LYNCHPIN: "ns/processor/LYNCHPIN"
      ORACLE: "ns/processor/ORACLE"
      CAERULA_ARBOR: "ns/executor/CAERULA_ARBOR"
      PRESERVATOR: "ns/executor/PRESERVATOR"

      input_0: "t/target_detector/prediction/target_list"
      input_1: "t/lane_detector/prediction/lane_error"        # 输入：航线偏离
      output_0: "t/chassis/control_sequence"                  # 输出：底盘控制序列
      duplex_0: "s/robotic_arm/command"                       # 双工：机械臂控制

# -------------------------------------------------------

  ##################################
  # 机械臂手眼 RealSense 相机控制器 #
  ##################################
  DWDB_221E:
    executable: "realsense_controller"
    node_type: "sensor"
    heartbeat_period_sec: 0.033            # 画面采集帧率
    channels:
      output_0: "t/realsense/robotic_arm/in_hand/color"      
      output_1: "t/realsense/robotic_arm/in_hand/depth"      
      output_2: "t/realsense/robotic_arm/in_hand/intrinsics" 

    # 通用配置块 ###################
    ###########
    serial_number: "034422074118"

# -------------------------------------------------------
  
  ################################
  # 底盘前视 RealSense 相机控制器 #
  ################################
  AMA_10:
    executable: "realsense_controller"
    node_type: "sensor"
    heartbeat_period_sec: 0.033            # 画面采集帧率
    channels:
      output_0: "t/realsense/chassis/front_facing/color"            # 输出：    
      output_1: "t/realsense/chassis/front_facing/depth"            # 输出： 
      output_2: "t/realsense/chassis/front_facing/intrinsics"       # 输出： 

    # 通用配置块 ###################
    ###########
    serial_number: "231122072487"

# -------------------------------------------------------

  ##############
  # 目标检测器 #
  ##############
  LYNCHPIN:
    executable: "target_detector"
    node_type: "processor"
    heartbeat_period_sec: 0.033
    channels:
      input_0: "t/realsense/robotic_arm/in_hand/color"          # 输入：
      input_1: "t/realsense/robotic_arm/in_hand/depth"          # 输入：
      input_2: "t/realsense/robotic_arm/in_hand/intrinsics"     # 输入：
      output_0: "t/target_detector/prediction/target_list"      # 输出：目标队列
      output_1: "t/target_detector/visualization/overlay"       # 输出：手眼相机目标框叠加层

    # 通用配置块 ###################
    ###########
    ats:
      queue_size: 10
      slop: 0.05

# -------------------------------------------------------
  
  #############
  # 航线检测器 #
  #############
  ORACLE:
    executable: "lane_detector"
    node_type: "processor"
    heartbeat_period_sec: 0.033
    channels:
      input_0: "t/realsense/chassis/front_facing/color"     
      output_0: "t/lane_detector/prediction/lane_error"         # 输出：航线偏离
      output_1: "t/lane_detector/visualization/overlay"         # 输出：底盘相机预测轨迹叠加层

# -------------------------------------------------------
  
  ###############
  # 机械臂控制器 #
  ###############
  CAERULA_ARBOR:
    executable: "robotic_arm_controller"
    node_type: "executor"
    heartbeat_period_sec: 0.1
    channels:
      duplex_0: "s/robotic_arm/command"                   # 双工：机械臂控制

# -------------------------------------------------------
  
  #############
  # 底盘控制器 #
  #############
  PRESERVATOR:
    executable: "chassis_controller"
    node_type: "executor"
    heartbeat_period_sec: 0.1
    channels:
      input_0: "t/chassis/control_sequence"                   # 底盘方向控制
      output_0: "cmd_vel"                                     # 轮趣 SDK：底盘控制信号

# -------------------------------------------------------

  ###############
  # Web UI 节点 #
  ###############
  PRIESTESS_EYES:
    executable: "web_app"
    channels:
      PRESERVATOR: "ns/executor/PRESERVATOR"
      input_0: "t/target_detector/visualization/overlay"
      input_1: "t/lane_detector/visualization/overlay"

    # 通用配置块 ###################
    ###########
    fps: 30           # 画面渲染帧率
    port: 8080

# -------------------------------------------------------

  ################
  # Sub 测试辅助节点 #
  ################
  YAN:
    executable: "sub_test"
    channels:
      output_0: "t/realsense/chassis/front_facing/color" 

    # 通用配置块 ###################
    ###########
    fps: 30           # 画面采集帧率
    video_path: "/home/lynchpin/repository/watermelon-robot/resource/datasets/lane-detection/legacy/video-5.mp4"

# -------------------------------------------------------