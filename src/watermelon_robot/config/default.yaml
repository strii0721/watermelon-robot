########################################### 以下是通用配置 ##########################################
# 目标检测模型相关
target_detection:
  model: 
    name: "yolov26-best-fp16.engine"
    task: "target-detection"
    use_engine: True
    device_no: "0"
    use_half: True
    image_size: [480, 640]
    confidence: 0.4
    iou: 0.8

# -------------------------------------------------------
# 导航线检测相关
lane_detection: 
  model:  
    name: "yolo26n-seg-b64-1779873368-fp16.engine"
    task: "lane-detection"
    use_engine: True
    device_no: "0"
    use_half: True
    confidence: 0.8
  roi:
    y_min_portion: 0.75                                     # 兴趣区域上界占图片高度比例
    y_max_portion: 0.99                                     # 兴趣区域下界占图片高度比例
  detect_step: 10
  
# -------------------------------------------------------
# 机械臂配置相关
robotic_arm_s: 
  ip: "192.168.58.2"
  speed_rate: 20                                            # 机械臂运动速率
  tool_standby_sextuple: [102, -230, 190, 179, -89, -89]    # 机械臂待机状态末端执行器位姿六元组
  camera_pose_matix: [[0, -1, 0, 25],                       # 相机参考系到执行器参考系的变换
                      [1, 0, 0, 60],
                      [0, 0, 1, 10],
                      [0, 0, 0, 1]]
  tool_error: [-50, 170, -90]                               # 剪刀的位置偏差（相机参考系下）

# robotic_arm: 
#   ip: "192.168.58.2"
#   speed_rate: 20
#   tool_standby_sextuple: [102, -282.5, 418, 180, -90, -90]
#   camera_pose_matix: [[0, -1, 0, 25],
#                       [1, 0, 0, 60],
#                       [0, 0, 1, 10],
#                       [0, 0, 0, 1]]
#   tool_error: [0, 50, -50]

# -------------------------------------------------------
# 底盘控制相关
chassis: 
  pid_controller: 
    pid_triple: [0.2, 0.02, 0.01]
    control_interval: 0.1
    integral_limit: 99999
    output_limit: 99999
  forward_speed: 0.40                                       # 底盘前进速度（m/s)
  stop_delay_sec: 3                                         # 当前版本底盘停止方案用来控制底盘停止的延迟。相关函数注释里有说明。

# -------------------------------------------------------
# 剪刀控制相关

scissors:
  tool_id: 8                # 剪刀在机械臂中的工具编号
  close_flag: 1             # 0/1 哪一个控制剪刀闭合
  open_delay_sec: 2         # 剪刀张开、闭合结束等待时间

######################################## 以下是节点初始化器配置 ########################################
_node_initializer:

  ################
  # 上逻辑控制器 #
  ################
  CELESTIAL_FULCRUM:

    # 标准通信接口配置块 ###################
    ##################
    input_0: "t/target_detector/prediction/target_list"
    duplex_0: "s/robotic_arm/command"               # 双工：机械臂控制
    duplex_1: "s/logic_controller/command"                 # 双工：上/下逻辑控制器

    # 通用配置块 ###################
    ###########

# -------------------------------------------------------
  
  ##############
  # 机械臂控制器 #
  ##############
  CAERULA_ARBOR:

    # 标准通信接口配置块 ###################
    ##################
    duplex_0: "s/robotic_arm/command"                   # 双工：机械臂控制

    # 通用配置块 ###################
    ###########

# -------------------------------------------------------

  ############################
  # Realsense 相机控制器：手眼 #
  ############################
  PRESERVATOR:

    # 标准通信接口配置块 ###################
    ##################
    output_0: "t/realsense/robotic_arm/in_hand/frame"       # 输出：手眼相机帧

    # 通用配置块 ###################
    ###########
    fps: 30                                                 # 画面采集帧率

# -------------------------------------------------------

  ##############
  # 目标检测器 #
  ##############
  LYNCHPIN:

    # 标准通信接口配置块 ###################
    ##################
    input_0: "t/realsense/robotic_arm/in_hand/frame"        # 输入：手眼相机目标框叠加层
    output_0: "t/target_detector/prediction/target_list"    # 输出：目标队列
    output_1: "t/target_detector/visualization/overlay"     # 输出：手眼相机目标框叠加层

# -------------------------------------------------------

  ##################
  # 监视器：手眼相机彩色图（预测框叠加层） #
  ##################
  PRIESTESS_EYES_0:

    # 标准通信接口配置块 ###################
    ##################
    input_0: "t/target_detector/visualization/overlay"       # 输入：手眼相机目标框叠加层

    # 通用配置块 ###################
    ###########
    fps: 30                           # 监视器显示帧率
    is_livestream: True               # 开启网页推流
    livestream_port: 8080             # 推流端口号

# -------------------------------------------------------
  ################
  # 下逻辑控制器 #
  ################
  ORACLE:

    # 标准通信接口配置块 ###################
    ##################
    input_0: "t/lane_detector/prediction/lane_error"        # 输入：航线偏离
    output_0: "t/chassis/control_sequence"                  # 输入：航线偏离
    duplex_0: "s/logic_controller/command"                  # 双工：上/下逻辑控制器

    # 通用配置块 ###################
    ###########
    heartbeat_period_sec: 0.01                              # Heartbeat 循环周期

# -------------------------------------------------------
  
  #############
  # 底盘控制器 #
  #############
  DWDB_221E:

    # 标准通信接口配置块 ###################
    ##################
    input_0: "t/chassis/control_sequence"                   # 底盘方向控制
    output_0: "cmd_vel"                                     # 轮趣 SDK：底盘控制信号

    # 通用配置块 ###################
    ###########

# -------------------------------------------------------
  
  ############################
  # Realsense 相机控制器：底盘 #
  ############################
  AMA_10:

    # 标准通信接口配置块 ###################
    ##################
    output_0: "t/realsense/chassis/front_facing/frame"       # 输出：底盘 RealSense 相机帧    

    # 通用配置块 ###################
    ###########
    fps: 30           # 画面采集帧率

# -------------------------------------------------------
  
  #############
  # 航线检测器 #
  #############
  LONETRAIL:

    # 标准通信接口配置块 ###################
    ##################
    input_0: "t/realsense/chassis/front_facing/frame"         # 输入：底盘 RealSense 相机帧
    output_0: "t/lane_detector/prediction/lane_error"         # 输出：航线偏离
    output_1: "t/lane_detector/visualization/overlay"         # 输出：底盘相机预测轨迹叠加层

# -------------------------------------------------------

  ##################
  # 监视器：底盘相机彩色图（预测轨迹叠加层） #
  ##################
  ZERO_ORDER_OIL_TANK_0:

    # 标准通信接口配置块 ###################
    ##################
    input_0: "t/lane_detector/visualization/overlay"               # 输入：底盘相机预测轨迹叠加层

    # 通用配置块 ###################
    ###########
    fps: 30                           # 监视器显示帧率
    is_livestream: True               # 开启网页推流
    livestream_port: 8080             # 推流端口号

# -------------------------------------------------------